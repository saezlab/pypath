name: Developer checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      postgres_fixtures:
        description: Run disposable local PostgreSQL fixtures
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: git submodule update --init pypath
      - run: uv sync --frozen --all-packages
      - run: make check check-generated test test-native test-wheels
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.postgres_fixtures }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          OMNIPATH_POSTGRES_BIN="$(pg_config --bindir)" make test-subsets
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: packages/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: packages/web/pnpm-lock.yaml
      - run: pnpm --dir packages/web install --frozen-lockfile
      - run: make check-web
      - run: pnpm --dir packages/web lint && pnpm --dir packages/web format:check && pnpm --dir packages/web build
