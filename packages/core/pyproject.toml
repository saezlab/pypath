[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnipath-core"
version = "0.1.0"
description = "Core shared vocabulary, schemas, keys, and versioning for OmniPath Parquet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "biolink-model==4.4.4",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0",
    "linkml-runtime>=1.9.5,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omnipath_core*"]

[tool.setuptools.package-data]
"omnipath_core" = ["vocab/*.yaml", "vocab/upstream/*.yaml"]
