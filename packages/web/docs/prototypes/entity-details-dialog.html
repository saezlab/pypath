const state = { view: 'findings', ent: 'tp53', tab: 'overview', kind: 'all', scope: 'all', q: '', sel: null, showAll: {}, descOpen: false };
try { const s = JSON.parse(localStorage.getItem('edp-state') || '{}'); if (s.view) state.view = s.view; if (s.ent) state.ent = s.ent; } catch (e) {}

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ent = () => ENT[state.ent];

function inScope(r) {
  if (state.scope === 'all') return true;
  if (state.scope === 'gene') return r.m.length === 0;
  return r.m.includes(state.scope);
}
function rows({ ignoreKind = false } = {}) {
  const q = state.q.trim().toLowerCase();
  return ent().rel.filter((r) => inScope(r) && (ignoreKind || state.kind === 'all' || r.k === state.kind) && (!q || r.o.toLowerCase().includes(q) || r.s.join(' ').includes(q)));
}
function kindCounts(list) {
  const c = {};
  for (const r of list) c[r.k] = (c[r.k] || 0) + 1;
  return KIND_ORDER.filter((k) => c[k]).map((k) => [k, c[k]]);
}
function scopeCount(id) {
  const e = ent();
  if (id === 'all') return e.rel.length;
  if (id === 'gene') return e.rel.filter((r) => !r.m.length).length;
  return e.rel.filter((r) => r.m.includes(id)).length;
}
function sourceCounts(list) {
  const c = {};
  for (const r of list) for (const s of r.s) c[s] = (c[s] || 0) + 1;
  return Object.entries(c).sort((a, b) => b[1] - a[1]);
}
const verbClass = (v) => (/activat/.test(v) ? 'pos' : /inhibit/.test(v) ? 'neg' : '');

/* ---------- shared pieces ---------- */
function identity({ compact = false, actions = true } = {}) {
  const e = ent();
  return `<header class="ident ${compact ? 'compact' : ''}">
    <div class="title-row"><h2 class="ename">${esc(e.name)}</h2><span class="fullname">${esc(e.fullname)}</span></div>
    <div class="chips">
      <span class="chip t-${e.type}"><span class="dot"></span>${esc(e.typeLabel)}</span>
      <span class="chip">${esc(e.groupNote)}</span>
      ${e.organism ? `<span class="chip">${esc(e.organism)}</span>` : ''}
    </div>
    <div class="ids">${e.ids.map(([k, v]) => `<a class="id" href="#" onclick="return false"><span>${esc(k)}</span><span class="mono">${esc(v)}</span><span class="faint" aria-hidden="true">↗</span></a>`).join('')}</div>
    ${actions ? `<div class="actions"><button class="btn primary" type="button">＋ Add to selection</button><button class="btn" type="button">Open in relations explorer</button></div>` : ''}
  </header>`;
}

function description({ clamp = true } = {}) {
  const e = ent();
  if (!e.description) return `<p class="empty">No description in this release. UniProt function text would go here once UniProt annotations are built in full.</p>`;
  const cl = clamp && !state.descOpen;
  return `<div style="display:grid;gap:4px"><p class="desc ${cl ? 'clamp' : ''}">${esc(e.description)}</p>
    <div class="muted" style="font-size:12px">Source: ${esc(e.descSource)} ${clamp ? `· <button class="link" data-act="desc">${state.descOpen ? 'Show less' : 'Show more'}</button>` : ''}</div></div>`;
}

function members({ asScope = false, compactRows = false } = {}) {
  const e = ent();
  const items = e.members.map((m) => {
    const n = scopeCount(m.id);
    const tag = asScope ? 'button' : 'button';
    return `<${tag} class="member" data-act="scope" data-v="${m.id}" ${asScope ? `aria-pressed="${state.scope === m.id}"` : ''}>
      <div><div class="nm">${esc(m.name)}</div><div class="sub ${e.type === 'gene' ? '' : 'mono'}">${esc(m.sub)}</div></div>
      <div class="cnt">${n} relations${asScope ? '' : ' →'}</div></${tag}>`;
  });
  if (asScope) {
    items.unshift(`<button class="member" data-act="scope" data-v="all" aria-pressed="${state.scope === 'all'}"><div><div class="nm">All of ${esc(e.name)}</div><div class="sub">${e.type === 'gene' ? 'Gene and every product' : 'Every form in the group'}</div></div><div class="cnt">${scopeCount('all')} relations</div></button>`);
    if (e.geneLevel) items.push(`<button class="member" data-act="scope" data-v="gene" aria-pressed="${state.scope === 'gene'}"><div><div class="nm">Gene level only</div><div class="sub">Evidence that names no product</div></div><div class="cnt">${scopeCount('gene')} relations</div></button>`);
  }
  return `<div class="members">${items.join('')}</div>`;
}

function glance(list, act = 'kind') {
  const kc = kindCounts(list);
  const max = Math.max(...kc.map(([, n]) => n), 1);
  return `<div class="glance">${kc.map(([k, n]) => `<button class="gl k-${k}" data-act="${act}" data-v="${k}"><span>${KIND[k].label}</span><span class="track"><span class="fill" style="display:block;width:${Math.max(4, (100 * n) / max)}%"></span></span><span class="v">${n}</span></button>`).join('')}</div>`;
}

function sources(list) {
  return `<div class="srcs">${sourceCounts(list).map(([s, n]) => `<span class="src">${esc(s)} · ${n}</span>`).join('')}</div>`;
}

function scopeFilter() {
  const e = ent();
  const opts = [['all', `All of ${e.name}`], ...e.members.map((m) => [m.id, e.type === 'gene' ? m.id : m.name])];
  if (e.geneLevel) opts.push(['gene', 'Gene level only']);
  return `<div class="frow"><span class="flabel">${e.type === 'gene' ? 'Product' : 'Form'}</span>${opts.map(([v, l]) => `<button class="pill" data-act="scope" data-v="${v}" aria-pressed="${state.scope === v}">${esc(l)} <span class="c">${scopeCount(v)}</span></button>`).join('')}</div>`;
}
function kindFilter() {
  const base = rows({ ignoreKind: true });
  const kc = kindCounts(base);
  return `<div class="frow"><span class="flabel">Kind</span><button class="pill" data-act="kind" data-v="all" aria-pressed="${state.kind === 'all'}">All <span class="c">${base.length}</span></button>${kc.map(([k, n]) => `<button class="pill k-${k}" data-act="kind" data-v="${k}" aria-pressed="${state.kind === k}"><span class="sw"></span>${KIND[k].label} <span class="c">${n}</span></button>`).join('')}
  <input class="search" id="relq" type="search" placeholder="Filter by partner or source" value="${esc(state.q)}" aria-label="Filter relations"></div>`;
}

function rowHtml(r, i, mode) {
  const e = ent();
  const selected = state.sel === i;
  const badges = e.type === 'gene'
    ? (r.m.length ? (r.m.length === e.members.length ? `<span class="sb">all products</span>` : r.m.map((m) => `<span class="sb">${m}</span>`).join('')) : `<span class="sb gene">gene level</span>`)
    : r.m.map((m) => `<span class="sb">${m === 'beta' ? 'beta-D-glucose' : 'D-glucose'}</span>`).join('');
  const attr = mode === 'inline' ? `aria-expanded="${selected}"` : `aria-current="${selected}"`;
  let html = `<button class="rrow" data-act="sel" data-v="${i}" ${attr}>
    <span class="verb ${verbClass(r.v)}">${esc(r.v)}</span>
    <span class="who"><span class="t-${r.t}" style="background:none"><span class="tdot"></span></span><b>${esc(r.o)}</b><span class="faint" style="font-size:12px"> · ${esc(TYPE_LABEL[r.t] || r.t)}</span><span class="scopebadges">${badges}</span></span>
    <span class="meta">${r.s.map((s) => `<span class="src">${esc(s)}</span>`).join('')}<span class="ev">${r.n} ev.</span></span>
  </button>`;
  if (mode === 'inline' && selected) html += `<div class="inline-ev">${evidence(r, { compact: true })}</div>`;
  return html;
}

function relationGroups(list, { mode = 'inline', limit = 0 } = {}) {
  if (!list.length) return `<p class="empty">No relations match these filters.</p>`;
  const all = ent().rel;
  return KIND_ORDER.filter((k) => list.some((r) => r.k === k)).map((k) => {
    const g = list.filter((r) => r.k === k);
    const lim = limit && !state.showAll[k] ? limit : Infinity;
    const shown = g.slice(0, lim);
    return `<section class="rgroup k-${k}" id="rel-${k}"><div class="rhead"><span class="sw"></span><b>${KIND[k].label}</b><span class="c">${g.length}</span></div>
      ${shown.map((r) => rowHtml(r, all.indexOf(r), mode)).join('')}
      ${g.length > shown.length ? `<button class="more link" data-act="showall" data-v="${k}">Show all ${g.length} ${KIND[k].label.toLowerCase()}</button>` : ''}</section>`;
  }).join('');
}

function evidence(r, { compact = false } = {}) {
  const e = ent();
  const named = e.type === 'gene'
    ? (r.m.length ? `Names ${r.m.length === e.members.length ? 'all three products' : r.m.join(', ')}` : 'Reported for the gene. No product named.')
    : `Reported for ${r.m.map((m) => (m === 'beta' ? 'beta-D-glucose' : 'D-glucose')).join(' and ')}`;
  const per = Math.max(1, Math.round(r.n / r.s.length));
  const cards = r.s.map((s) => `<div class="evcard"><div class="top"><b>${esc(s)}</b><span class="faint" style="font-size:12px">${per} record${per > 1 ? 's' : ''}</span></div>
      <dl class="facts" style="font-size:13px"><dt>Molecular form</dt><dd>${esc(named)}</dd><dt>Relation</dt><dd class="mono">${esc(r.pred)}</dd>${r.k === 'regulation' ? `<dt>Effect</dt><dd>${/inhibit/.test(r.v) ? 'Inhibition' : 'Activation'}</dd>` : ''}</dl></div>`).join('');
  return `<div class="evp">
    ${compact ? '' : '<div class="h">Evidence</div>'}
    <p class="sentence">${esc(e.name)} <span class="verb ${verbClass(r.v)}">${esc(r.v)}</span> ${esc(r.o)}</p>
    <div class="chips"><span class="chip t-${r.t}"><span class="dot"></span>${esc(TYPE_LABEL[r.t] || r.t)}</span><span class="chip">${r.n} evidence record${r.n > 1 ? 's' : ''}</span></div>
    ${cards}
    <div class="actions"><button class="btn" type="button">Open ${esc(r.o.length > 28 ? 'partner' : r.o)}</button><button class="btn" type="button">Full evidence</button></div>
    <div class="illus">Record fields are illustrative. The real panel reuses InteractionDetails.</div>
  </div>`;
}

function identifiersBlock() {
  const e = ent();
  const groups = e.type === 'gene'
    ? [['Primary', [['Entrez Gene', '7157'], ['HGNC', 'HGNC:11998'], ['Ensembl gene', 'ENSG00000141510'], ['Gene symbol', 'TP53']]], ['Products', [['UniProt', 'P04637, K7PPA8, Q53GA5 + 11 more']]], ['Synonyms', [['Gene symbol synonym', 'P53']]], ['Internal', [['RaMP gene', 'RAMP_G_000008249']]]]
    : [['Primary', [['InChIKey', 'WQZGKKKJIJFFOK-GASJEMHNSA-N'], ['HMDB', 'HMDB0000122'], ['ChEBI', 'CHEBI:4167, CHEBI:15903 + 9 more'], ['KEGG', 'C00031'], ['PubChem', 'CID 5793']]], ['Cross-references', [['BiGG', 'glc__D, glc__bD + 3 more'], ['CAS', '50-99-7, 492-61-5'], ['MetaNetX', 'MNXM1137670']]], ['Names', [['Synonyms', 'Dextrose, Grape sugar, D-Glc + 31 more']]]];
  return `<div class="stack">${groups.map(([h, items]) => `<div><div class="h">${h}</div><dl class="facts">${items.map(([k, v]) => `<dt>${esc(k)}</dt><dd class="mono">${esc(v)}</dd>`).join('')}</dl></div>`).join('')}
    <div><button class="link">Show all ${e.counts.identifiers} identifiers</button></div></div>`;
}

function literatureBlock() {
  const e = ent();
  if (!e.counts.publications && !e.counts.annotations) return `<p class="empty">No annotations or publications in this release.</p>`;
  return `<div class="stack"><div><div class="h">Annotations <span class="n">${e.counts.annotations}</span></div><dl class="facts"><dt>SBO term</dt><dd class="mono">SBO:0000247 <span class="faint">imm1415</span></dd><dt>Source records</dt><dd>4 Reactome records <span class="faint">reactome</span></dd></dl></div>
    <div><div class="h">Publications <span class="n">${e.counts.publications}</span></div><dl class="facts"><dt class="mono">PMID:32033212</dt><dd>HMDB</dd><dt class="mono">PMID:19212411</dt><dd>HMDB</dd><dt class="mono">PMID:16736954</dt><dd>HMDB</dd></dl><button class="link" style="margin-top:6px">Show all ${e.counts.publications} publications</button></div></div>`;
}

/* ---------- variant A ---------- */
function variantA() {
  const e = ent();
  const tabs = [['overview', 'Overview'], ['relations', 'Relations', e.rel.length], ['identifiers', 'Identifiers', e.counts.identifiers], ['more', 'Annotations & publications', e.counts.publications + e.counts.annotations || null]];
  let body = '';
  if (state.tab === 'overview') {
    body = `<div class="pad"><div class="cols">
      <div class="stack">
        <div><div class="h">About</div>${description()}</div>
        ${e.facts ? `<div><div class="h">Properties</div><dl class="facts">${e.facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>` : ''}
        <div><div class="h">${e.memberNoun} in this group <span class="n">${e.members.length}</span></div>${members()}</div>
      </div>
      <div class="stack">
        ${e.type === 'chemical_entity' ? structure() : ''}
        <div><div class="h">Relations <span class="n">${e.rel.length}</span></div>${glance(e.rel, 'gokind')}<div style="margin-top:8px"><button class="link" data-act="tab" data-v="relations">See all relations →</button></div></div>
        <div><div class="h">Sources</div>${sources(e.rel)}</div>
        ${e.synonyms.length ? `<div><div class="h">Also known as</div><div class="muted">${e.synonyms.map(esc).join(', ')}</div></div>` : ''}
      </div></div></div>`;
  } else if (state.tab === 'relations') {
    body = `<div class="pad stack" style="gap:16px"><div class="filters">${scopeFilter()}${kindFilter()}</div>${relationGroups(rows(), { mode: 'inline' })}</div>`;
  } else if (state.tab === 'identifiers') {
    body = `<div class="pad">${identifiersBlock()}</div>`;
  } else {
    body = `<div class="pad">${literatureBlock()}</div>`;
  }
  return `<div class="dialog"><button class="x" aria-label="Close">✕</button>${identity()}
    <nav class="tabs" role="tablist">${tabs.map(([v, l, n]) => `<button role="tab" data-act="tab" data-v="${v}" aria-selected="${state.tab === v}">${l}${n ? `<span class="n">${n}</span>` : ''}</button>`).join('')}</nav>
    <div class="body">${body}</div></div>`;
}

/* ---------- variant B ---------- */
function variantB() {
  const e = ent();
  const kc = kindCounts(rows({ ignoreKind: true }));
  const sel = state.sel != null ? e.rel[state.sel] : null;
  return `<div class="dialog"><button class="x" aria-label="Close">✕</button>${identity()}
    <div class="bwrap">
      <nav class="rail" aria-label="Sections">
        <a href="#b-overview" data-jump="b-overview">Overview</a>
        <a href="#b-members" data-jump="b-members">${e.memberNoun}<span class="c">${e.members.length}</span></a>
        <a href="#b-relations" data-jump="b-relations">Relations<span class="c">${e.rel.length}</span></a>
        ${kc.map(([k, n]) => `<a class="sub" href="#rel-${k}" data-jump="rel-${k}">${KIND[k].label}<span class="c">${n}</span></a>`).join('')}
        <a href="#b-ids" data-jump="b-ids">Identifiers<span class="c">${e.counts.identifiers}</span></a>
        <a href="#b-lit" data-jump="b-lit">Annotations & publications</a>
      </nav>
      <div class="body" id="bscroll">
        <section class="bsec" id="b-overview"><div class="cols"><div class="stack" style="gap:14px"><div class="h">About</div>${description()}${e.facts ? `<dl class="facts">${e.facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>` : ''}</div>
          <div class="stack" style="gap:14px">${e.type === 'chemical_entity' ? structure() : `<div><div class="h">Sources</div>${sources(e.rel)}</div>`}</div></div></section>
        <section class="bsec" id="b-members"><div class="h">${e.memberNoun} <span class="n">${e.members.length}</span></div><p class="muted" style="margin:0 0 10px">Pick one to narrow the relations below to evidence that names it.</p>${members({ asScope: true })}</section>
        <section class="bsec" id="b-relations"><div class="h">Relations <span class="n">${rows().length} of ${e.rel.length}</span></div><div class="filters" style="margin-bottom:14px">${kindFilter()}</div>${relationGroups(rows(), { mode: 'drawer', limit: 5 })}</section>
        <section class="bsec" id="b-ids"><div class="h" style="margin-bottom:12px">Identifiers</div>${identifiersBlock()}</section>
        <section class="bsec" id="b-lit" style="padding-bottom:28px"><div class="h" style="margin-bottom:12px">Annotations & publications</div>${literatureBlock()}</section>
      </div>
    </div>
    ${sel ? `<aside class="drawer" aria-label="Evidence"><div style="display:flex;justify-content:space-between;align-items:center"><div class="h" style="margin:0">Evidence</div><button class="btn" data-act="sel" data-v="${state.sel}">Close</button></div>${evidence(sel, { compact: true })}</aside>` : ''}
  </div>`;
}

/* ---------- variant C ---------- */
function variantC() {
  const e = ent();
  const base = rows({ ignoreKind: true });
  const kc = kindCounts(base);
  const list = rows();
  const sel = state.sel != null ? e.rel[state.sel] : null;
  return `<div class="dialog"><button class="x" aria-label="Close">✕</button>
    <div class="cwrap">
      <aside class="side">
        ${identity({ compact: true, actions: false })}
        <div class="blk">${description()}</div>
        <div class="blk"><div class="h" style="margin:0">${e.memberNoun} <span class="n">scope for relations</span></div>${members({ asScope: true })}</div>
        ${e.type === 'chemical_entity' ? `<div class="blk">${structure()}</div>` : ''}
        <div class="blk"><div class="h" style="margin:0">Reference</div>
          <button class="link" style="text-align:left">All identifiers (${e.counts.identifiers})</button>
          ${e.counts.publications ? `<button class="link" style="text-align:left">Publications (${e.counts.publications})</button>` : ''}
          ${e.counts.annotations ? `<button class="link" style="text-align:left">Annotations (${e.counts.annotations})</button>` : ''}
          ${e.synonyms.length ? `<div class="muted" style="font-size:12.5px">Also known as ${e.synonyms.map(esc).join(', ')}</div>` : ''}</div>
        <div class="blk"><button class="btn primary" style="justify-content:center">＋ Add to selection</button></div>
      </aside>
      <div class="work">
        <div class="top">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap"><h3 class="h2">Relations <span class="faint" style="font-weight:500;font-size:14px">${base.length}${state.scope !== 'all' ? ` for ${esc(state.scope === 'gene' ? 'gene level' : (e.members.find((m) => m.id === state.scope) || {}).name + (e.type === 'gene' ? ' ' + state.scope : ''))}` : ''}</span></h3>
            <input class="search" id="relq" type="search" placeholder="Filter by partner or source" value="${esc(state.q)}" aria-label="Filter relations"></div>
          <div class="ktabs" role="tablist"><button role="tab" data-act="kind" data-v="all" aria-selected="${state.kind === 'all'}">All <span class="c">${base.length}</span></button>${kc.map(([k, n]) => `<button role="tab" class="k-${k}" data-act="kind" data-v="${k}" aria-selected="${state.kind === k}"><span class="sw"></span>${KIND[k].label}<span class="c">${n}</span></button>`).join('')}</div>
        </div>
        <div class="split ${sel ? 'open' : ''}">
          <div class="list">${relationGroups(list, { mode: 'side' })}</div>
          ${sel ? `<div class="evcol"><div style="display:flex;justify-content:flex-end"><button class="btn" data-act="sel" data-v="${state.sel}">Close</button></div>${evidence(sel)}</div>` : ''}
        </div>
      </div>
    </div></div>`;
}

/* ---------- findings ---------- */
function findings() {
  const F = [
    ['hi', 'Relations are split over two tabs', 'For TP53 the <q>Relationships 6</q> tab holds only complex membership. The other 70 relations (51 pathways, 10 regulations, 6 interactions, 2 diseases, 1 figure) sit inside <q>Products and molecular evidence</q>, below the products and forms. The 6 memberships show up in both tabs.'],
    ['hi', 'Clicking a relation seems to do nothing', 'The evidence renders at the very bottom of the Products tab, after up to 100 standalone observation cards. Nothing changes near the row you clicked.'],
    ['hi', 'No summary, everything weighs the same', 'Below the name, one muted line mixes type, <q>gene, protein source records</q>, <q>Grouped · 4 matched entities</q>, taxon and a raw ID. Nothing tells you what the entity is or how much is known about it.'],
    ['md', 'The landing tab changes per entity', 'TP53 opens on a raw identifier table because it has no description, so the General tab is dropped. Glucose opens on a 400-word HMDB paragraph.'],
    ['md', 'The Products tab mixes five things', 'A raw key line (<q>Gene reference: entrez:7157</q>), two buttons that both read <q>TP53 · protein</q>, the same three products again as form cards, relations as <q>Apoptosis · has_participant · TP53</q> with no sources or counts, then repeated <q>kegg · Protein reference TP53 · P04637</q> cards.'],
    ['md', 'A single protein shows the whole gene', 'Opening P04637 ungrouped shows the same 76 gene-wide relations, because the molecular view defaults to the gene reference.'],
    ['md', 'Glucose: the tab errors', '<q>Products and molecular evidence</q> is offered for the chemical group and shows <q>Unable to load molecular evidence</q>. The endpoint returns 404 for <q>connectivity:…</q> keys.'],
    ['md', 'Internal provenance is shown as content', 'Relationship properties list <q>Prov:wasDerivedFrom: urn:sha256:…</q> and <q>Dcterms:type: object</q>. The same Rhea reaction appears as two rows, one per source.'],
    ['lo', 'Footer shows on every tab', '<q>Load more details · Names and annotations load 20 at a time</q> sits under Relationships and Products too, where it does nothing visible.'],
    ['lo', 'Data issues seen along the way', 'KEGG pathway names prefixed <q>TITLE:</q>. An IntAct partner named <q>29031019</q>. HMDB mojibake <q>world‚Äôs</q>. A GenBank identifier <q>-</q>. <q>Q53GA5_HUMAN</q> stored as a gene symbol.'],
  ];
  return `<div class="dialog free"><div class="findings">
    <div><h2 class="h2" style="font-size:18px">What I found in the current dialog</h2><p class="muted" style="margin:4px 0 0;max-width:72ch">Checked on omnipath-metabo-dev (capped build, 2026.10.6) with TP53 grouped by gene, TP53 P04637 ungrouped, and glucose grouped by structure.</p></div>
    <div class="fgrid">${F.map(([s, h, p]) => `<div class="f"><h3><span class="sev ${s}">${{ hi: 'High', md: 'Medium', lo: 'Low' }[s]}</span>${h}</h3><p>${p}</p></div>`).join('')}</div>
    <div><h2 class="h2">What all three prototypes share</h2>
    <ul class="princ" style="margin-top:8px">
      <li>One identity block on top: name, full name, type, group, organism, and the key identifiers as links. It looks the same for every entity.</li>
      <li>One place for relations. A gene group gets a product scope (all of TP53, P04637, K7PPA8, Q53GA5, gene level only) instead of a separate tab. A chemical group gets the same control for its forms.</li>
      <li>Relations read from the entity's side (<em>activated by</em> MAPK9, <em>participates in</em> Apoptosis), grouped by kind with counts, with sources and evidence counts on every row.</li>
      <li>Evidence opens next to the row you clicked.</li>
      <li>Identifiers, annotations and publications are reference material. They stay reachable but never the landing view. Identifiers are grouped into primary, cross-references and synonyms.</li>
      <li>Provenance hashes and RDF types are hidden. Rows for the same partner from different sources merge into one row with several source chips.</li>
    </ul></div>
    <div><h2 class="h2">The three layouts</h2><div class="vcards" style="margin-top:8px">
      <button class="vcard" data-act="view" data-v="a"><b>A · Tidy tabs</b><span>Keep the dialog and tabs. Overview first, one Relations tab with scope, evidence inline. The cheapest change.</span></button>
      <button class="vcard" data-act="view" data-v="b"><b>B · One scroll</b><span>No tabs. Sections with an index on the left, top 5 per relation kind, evidence in a drawer.</span></button>
      <button class="vcard" data-act="view" data-v="c"><b>C · Summary + relations</b><span>A pinned summary on the left whose product list scopes the relations. A relations workspace on the right with an evidence column.</span></button>
    </div></div>
    <p class="illus" style="margin:0">The relations in the prototypes are the real ones from the capped build. Which product each relation names is approximated by source, and the evidence fields are illustrative.</p>
  </div></div>`;
}

/* ---------- render + events ---------- */
const root = document.getElementById('root');
function render() {
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.view === state.view));
  document.querySelectorAll('[data-ent]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.ent === state.ent));
  document.getElementById('entseg').hidden = state.view === 'findings';
  const v = VARIANTS[state.view];
  document.getElementById('vnote').innerHTML = v.note ? `<span>${v.note}</span>` : '<span>Start with the findings, then open a layout. Each layout works for <b>TP53</b> (gene group) and <b>Glucose</b> (chemical group). Click relations, product chips and kind filters.</span>';
  const scroller = root.querySelector('#bscroll');
  const keep = scroller ? scroller.scrollTop : 0;
  root.innerHTML = state.view === 'findings' ? findings() : state.view === 'a' ? variantA() : state.view === 'b' ? variantB() : variantC();
  const ns = root.querySelector('#bscroll');
  if (ns) ns.scrollTop = keep;
  try { localStorage.setItem('edp-state', JSON.stringify({ view: state.view, ent: state.ent })); } catch (e) {}
}
function reset() { state.kind = 'all'; state.scope = 'all'; state.q = ''; state.sel = null; state.showAll = {}; state.descOpen = false; }

document.addEventListener('click', (ev) => {
  const vb = ev.target.closest('[data-view]');
  if (vb) { state.view = vb.dataset.view; state.tab = 'overview'; reset(); render(); return; }
  const eb = ev.target.closest('[data-ent]');
  if (eb) { state.ent = eb.dataset.ent; state.tab = 'overview'; reset(); render(); return; }
  const j = ev.target.closest('[data-jump]');
  if (j) { ev.preventDefault(); const t = root.querySelector('#' + j.dataset.jump); const sc = root.querySelector('#bscroll'); if (t && sc) sc.scrollTo({ top: t.offsetTop - sc.offsetTop, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return; }
  const a = ev.target.closest('[data-act]');
  if (!a) return;
  const v = a.dataset.v;
  switch (a.dataset.act) {
    case 'view': state.view = v; state.tab = 'overview'; reset(); break;
    case 'tab': state.tab = v; state.sel = null; break;
    case 'kind': state.kind = v; state.sel = null; break;
    case 'gokind': state.tab = 'relations'; state.kind = v; state.sel = null; break;
    case 'scope':
      state.scope = state.view !== 'a' && state.scope === v && v !== 'all' ? 'all' : v;
      state.sel = null;
      if (state.view === 'a') state.tab = 'relations';
      if (state.kind !== 'all' && !rows().length) state.kind = 'all';
      break;
    case 'sel': state.sel = state.sel === Number(v) ? null : Number(v); break;
    case 'showall': state.showAll[v] = true; break;
    case 'desc': state.descOpen = !state.descOpen; break;
    default: return;
  }
  render();
});
document.addEventListener('input', (ev) => {
  if (ev.target.id !== 'relq') return;
  state.q = ev.target.value; state.sel = null;
  const pos = ev.target.selectionStart;
  render();
  const n = document.getElementById('relq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
});
render();
</script>
