# Read-only distribution of finalized artifacts. Never expose the data root.
server {
    listen 8080;
    server_name _;
    root /data;
    autoindex off;
    disable_symlinks on;
    sendfile on;
    # Parquet already has internal compression; byte offsets must stay stable.
    gzip off;
    etag on;
    types {
        application/vnd.apache.parquet parquet;
        application/json json;
    }
    default_type application/octet-stream;

    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-Range, If-None-Match, If-Modified-Since" always;
    add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Range, Content-Length, ETag, Last-Modified" always;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        add_header Cache-Control no-store;
        return 200 "ok\n";
    }

    # The published tables only; serving tables (relation_endpoint, entity_group,
    # entity_term) are internal lookup indexes.
    location ~ ^/resources/([a-z0-9][a-z0-9_-]*)/([0-9]+(?:\.[0-9]+)*)/((entity|entity_identifier|entity_annotation|entity_evidence|relation|relation_annotation|relation_evidence|evidence_payloads)\.parquet|build_manifest\.json)$ {
        set $resource_directory /data/resources/$1/$2;
        if (!-f $resource_directory/entity.parquet) { return 404; }
        if (!-f $resource_directory/relation.parquet) { return 404; }
        if (-f $resource_directory/.entities.chunks.parquet) { return 404; }
        if ($request_method = OPTIONS) { return 204; }
        limit_except GET OPTIONS { deny all; }
        try_files $uri =404;
    }

    location ~ ^/releases/[a-zA-Z0-9][a-zA-Z0-9_.-]*\.json$ {
        if ($request_method = OPTIONS) { return 204; }
        limit_except GET OPTIONS { deny all; }
        try_files $uri =404;
    }

    location ~ ^/references/taxonomy/[a-zA-Z0-9][a-zA-Z0-9_.-]*/taxonomy\.parquet$ {
        if ($request_method = OPTIONS) { return 204; }
        limit_except GET OPTIONS { deny all; }
        try_files $uri =404;
    }

    location / { return 404; }
}
