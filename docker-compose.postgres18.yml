services:
  postgres:
    # Custom postgres:18 with pg_roaringbitmap (+ rdkit) — REQUIRED: the build's
    # derivations create the roaringbitmap extension
    # (packages/postgres/omnipath_postgres/relational/db/bitmaps.py).
    # The stock postgres:18 image lacks it. See postgres/Dockerfile.
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: omnipath-build-postgres:18
    # Auto-start on host/daemon restart so the build DB survives reboots
    # without a manual `compose up`.
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnipath
      POSTGRES_USER: omnipath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a private environment file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    # Docker defaults /dev/shm to 64MB, which is too small for the parallel-query
    # dynamic-shared-memory segments the metabo post-build (e.g. the Goslin lipid
    # labelling query) allocates — it failed with "could not resize shared memory
    # segment: No space left on device". The present deploy compose already sets
    # this; the build compose was missing it. (derive itself is serial INSERT…SELECT
    # so it never hit the limit.)
    shm_size: ${POSTGRES_SHM_SIZE:-1gb}
    command:
      - postgres
      - -c
      - max_wal_size=8GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      # Parallelism caps (need to be container-level; the build raises the
      # per-gather/maintenance GUCs per session but is bounded by these). Developer defaults; use deploy/postgres-server.env.example
      # as a starting point for a separately sized server.
      - -c
      - max_worker_processes=${POSTGRES_MAX_WORKER_PROCESSES:-4}
      - -c
      - max_parallel_workers=${POSTGRES_MAX_PARALLEL_WORKERS:-4}
      - -c
      - effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}
      # The release loader defers the constraints of every resource partition in
      # one transaction: about 60 locks per resource. The default 64 per connection
      # slot held 46 resources but not 171 ("out of shared memory").
      - -c
      - max_locks_per_transaction=${POSTGRES_MAX_LOCKS_PER_TRANSACTION:-512}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnipath -d omnipath"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres18_data:/var/lib/postgresql

volumes:
  postgres18_data:
